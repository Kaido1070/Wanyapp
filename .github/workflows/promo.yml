name: Record Rany promo
on:
  workflow_dispatch:
    inputs:
      session:
        description: Short-lived demo session (revoked after the recording)
        required: true
permissions:
  contents: read
jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Read the session from the event payload so it never appears in a printed command or env block.
      - name: Load demo session
        run: |
          TOKEN=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]["session"])')
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" > "$RUNNER_TEMP/promo-session"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Prepare a dark iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); vs=[v for k,l in d["devices"].items() if "iOS" in k for v in l if v["name"].startswith("iPhone")]; pro=[v for v in vs if "Pro" in v["name"] and "Max" not in v["name"]]; print((pro or vs)[-1]["udid"])')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
      - name: Build for recording
        run: xcodebuild build-for-testing -project Wany.xcodeproj -scheme RanyPromo -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-promo CODE_SIGNING_ALLOWED=NO
      - name: Record the app
        run: |
          mkdir -p promo
          xcrun simctl io "$SIMULATOR_ID" recordVideo --codec=h264 --force promo/rany-promo.mp4 > promo/recorder.log 2>&1 &
          RECORDER=$!
          sleep 2
          python3 -c 'import time; print("PROMO-MARK recording", "%.3f" % time.time())' | tee promo/marks.txt
          set +e
          TEST_RUNNER_RANY_PROMO_SESSION="$(cat "$RUNNER_TEMP/promo-session")" xcodebuild test-without-building -project Wany.xcodeproj -scheme RanyPromo -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-promo -test-timeouts-enabled NO CODE_SIGNING_ALLOWED=NO > promo/test.log 2>&1
          STATUS=$?
          set -e
          sleep 2
          kill -INT $RECORDER; wait $RECORDER || true
          grep -o 'PROMO-MARK [a-z-]* [0-9.]*' promo/test.log | sort -u -k3 >> promo/marks.txt || true
          grep -E 'error:|failed|passed|skipped' promo/test.log | tail -20
          rm -f "$RUNNER_TEMP/promo-session"
          ls -la promo
          exit $STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rany-promo-recording
          path: |
            promo/rany-promo.mp4
            promo/marks.txt
          retention-days: 3
