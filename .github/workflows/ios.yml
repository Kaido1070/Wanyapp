name: Build Rany IPA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wany-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Iterative pull-request commits keep their candidate number. On main, the strict
      # gate below compares every push with the last published release instead, so an
      # unpublished candidate can absorb further changes without skipping a number.
      - name: Validate development version and preserved release history
        if: github.event_name == 'pull_request'
        env:
          DEVELOPMENT_BASE: ${{ github.event.pull_request.head.sha && format('{0}^', github.event.pull_request.head.sha) || github.event.before || 'HEAD^' }}
        run: node scripts/check-release.mjs --development --base "$DEVELOPMENT_BASE"
      - name: Verify release-policy regression cases
        run: node --test scripts/check-release.test.mjs
      - name: Verify shared feed algorithms
        run: node --test scripts/feed-engine.test.mjs
      - name: Verify exact approved background source
        run: node --test scripts/approved-background.test.mjs
      - name: Render approved visual reference fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/rany-reference" --no-save --ignore-scripts @napi-rs/canvas@0.1.100
          NODE_PATH="$RUNNER_TEMP/rany-reference/node_modules" node scripts/render-approved-background.cjs
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Compile application and tests
        run: xcodebuild build-for-testing -project Wany.xcodeproj -scheme Wany -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO
      - name: Run mandatory application tests
        run: xcodebuild test-without-building -project Wany.xcodeproj -scheme Wany -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 180 -derivedDataPath build-simulator -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO
      - name: Validate release candidate against production baseline
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Compare with the last published release, not the previous push: a failed,
          # undelivered candidate keeps its number while it is being fixed.
          BASE="${RELEASE_BASE:-$(git describe --tags --abbrev=0 --match 'v*-build*' 2>/dev/null || echo 'HEAD^')}"
          echo "Release baseline: $BASE"
          node scripts/check-release.mjs --base "$BASE"
      - name: Build iPhone app
        run: xcodebuild build -project Wany.xcodeproj -scheme Wany -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for sideload signing
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/Wany.app output/Payload/
          cd output
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Wany.app/Info.plist)
          /usr/bin/zip -qr "Rany-$VERSION.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Rany-IPA-unsigned
          path: output/Rany-*.ipa
          retention-days: 14
      - name: Archive tested simulator application for independent capture
        run: ditto -c -k --sequesterRsrc --keepParent build-simulator/Build/Products/Debug-iphonesimulator/Wany.app Rany-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Rany-tested-simulator
          path: Rany-simulator.zip
          retention-days: 14
      - name: Export optional presentation screenshots
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: Rany-native-preview
          path: screenshots
          retention-days: 7
      - name: Publish GitHub Release with the IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLIST=output/Payload/Wany.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          # The IPA must match the newest release note before it is published.
          node -e 'const [n]=require("./Wany/Resources/Releases.json");if(n.version!==process.argv[1]||String(n.build)!==process.argv[2]){console.error(`IPA ${process.argv[1]} (${process.argv[2]}) does not match release notes ${n.version} (${n.build})`);process.exit(1)}' "$VERSION" "$BUILD"
          node -e 'const [n]=require("./Wany/Resources/Releases.json");console.log(`**الإصدار:** ${n.version} · **البناء:** ${n.build} · **التاريخ:** ${n.date}\n\n### التغييرات\n${n.changes.map(c=>"- "+c).join("\n")}\n\nملف IPA غير موقّع؛ وقّعه بأداة التثبيت الخاصة بك.`)' > release-notes.md
          TAG="v$VERSION-build$BUILD"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "output/Rany-$VERSION.ipa" --clobber
          else
            gh release create "$TAG" "output/Rany-$VERSION.ipa" --target "$GITHUB_SHA" --title "Rany $VERSION ($BUILD)" --notes-file release-notes.md --latest
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Wany-test-results
          path: TestResults.xcresult
          retention-days: 7
  capture:
    name: Production opening recording (retry this job independently)
    needs: build
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Download previously tested application without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: Rany-tested-simulator
      - name: Select and boot recording simulator
        run: |
          ditto -x -k Rany-simulator.zip .
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" Wany.app
      - name: Record actual cold launch for guest and signed-in fixtures
        run: |
          mkdir -p cinematic-preview
          record_intro() {
            CASE_NAME="$1"
            shift
            xcrun simctl terminate "$SIMULATOR_ID" site.wany.reader || true
            RECORD_LOG="cinematic-preview/$CASE_NAME-recording.log"
            xcrun simctl io "$SIMULATOR_ID" recordVideo --codec=h264 "cinematic-preview/Rany-$CASE_NAME.mp4" > "$RECORD_LOG" 2>&1 &
            RECORD_PID=$!
            trap 'kill -INT "$RECORD_PID" 2>/dev/null || true' EXIT
            for ATTEMPT in {1..300}; do
              if grep -q "Recording started" "$RECORD_LOG"; then break; fi
              kill -0 "$RECORD_PID" || { cat "$RECORD_LOG"; return 1; }
              sleep 0.1
            done
            grep -q "Recording started" "$RECORD_LOG" || { cat "$RECORD_LOG"; return 1; }
            xcrun simctl launch "$SIMULATOR_ID" site.wany.reader --rany-opening-fixture "$@"
            sleep 20
            kill -INT "$RECORD_PID"
            wait "$RECORD_PID" || true
            trap - EXIT
            test -s "cinematic-preview/Rany-$CASE_NAME.mp4"
          }
          record_intro login
          record_intro signed-in --rany-cinematic-signed-in
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > cinematic-preview/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rany-production-opening-video
          overwrite: true
          path: cinematic-preview
          retention-days: 14
