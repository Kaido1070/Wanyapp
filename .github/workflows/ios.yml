name: Build Wany IPA
on:
  push:
    branches: [main]
    paths: ['Wany/**', 'Tests/**', 'project.yml', '.github/workflows/ios.yml', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wany-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify shared feed algorithms
        run: node --test scripts/feed-engine.test.mjs
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Run persistence and download tests
        run: xcodebuild test -project Wany.xcodeproj -scheme Wany -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-simulator -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO
      - name: Build iPhone app
        run: xcodebuild build -project Wany.xcodeproj -scheme Wany -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for sideload signing
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/Wany.app output/Payload/
          cd output
          /usr/bin/zip -qr Wany.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Wany-IPA-unsigned
          path: output/Wany.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Wany-test-results
          path: TestResults.xcresult
          retention-days: 7
