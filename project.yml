name: Wany
options:
  bundleIdPrefix: site.wany
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '1.3.32'
    CURRENT_PROJECT_VERSION: '60'
    # Xcode 16.4's iOS 18.5 simulator cannot resolve the WebKit Swift
    # overlay below 18.4 (WebKit bug 293831). Device support stays iOS 17.
    "IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]": '18.4'
targets:
  Wany:
    info:
      path: Wany/Info.plist
      properties:
        UIAppFonts: [RanyScript.otf]
    type: application
    platform: iOS
    sources:
      - path: Wany
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.wany.reader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rany
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - sdk: WebKit.framework
      - sdk: JavaScriptCore.framework
      - sdk: Security.framework
      - sdk: Network.framework
  WanyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Wany
schemes:
  Wany:
    build:
      targets:
        Wany: all
        WanyTests: [test]
    test:
      targets: [WanyTests]
